name: Build and Release Extension

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ci:
        name: Build extensions
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Clean generated packages
              run: rm -rf .output release-packages

            - name: Typecheck
              run: bun run typecheck

            - name: Build Chromium extension
              run: bun run zip

            - name: Build Firefox extension
              run: bun run zip:firefox

            - name: Prepare release packages
              run: |
                  version="$(node -p "require('./package.json').version")"
                  chrome=".output/belle-pku-${version}-chrome.zip"
                  firefox=".output/belle-pku-${version}-firefox.zip"
                  test -f "$chrome"
                  test -f "$firefox"
                  mkdir -p release-packages
                  cp "$chrome" release-packages/
                  cp "$firefox" release-packages/

            - name: Upload extension packages
              uses: actions/upload-artifact@v4
              with:
                  name: browser-extension-packages
                  path: |
                      release-packages/*-chrome.zip
                      release-packages/*-firefox.zip
                  if-no-files-found: error
                  retention-days: 14

    release:
        name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download extension packages
              uses: actions/download-artifact@v4
              with:
                  name: browser-extension-packages
                  path: release-packages

            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  shopt -s nullglob
                  chrome=(release-packages/*-chrome.zip)
                  firefox=(release-packages/*-firefox.zip)
                  test "${#chrome[@]}" -eq 1
                  test "${#firefox[@]}" -eq 1
                  gh release create "$GITHUB_REF_NAME" \
                      --verify-tag \
                      --generate-notes \
                      "${chrome[0]}" \
                      "${firefox[0]}"

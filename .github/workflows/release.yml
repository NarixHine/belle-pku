name: Build and Release Extension

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # PR / main gate: typecheck + build + package checks only. Never signs or publishes.
    ci:
        name: Build extensions
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Clean generated packages
              run: rm -rf .output release-packages

            - name: Typecheck
              run: bun run typecheck

            - name: Build Chromium extension
              run: bun run zip

            - name: Build Firefox extension
              run: bun run zip:firefox

            - name: Prepare release packages
              run: |
                  version="$(node -p "require('./package.json').version")"
                  chrome=".output/belle-pku-${version}-chrome.zip"
                  firefox=".output/belle-pku-${version}-firefox.zip"
                  test -f "$chrome"
                  test -f "$firefox"
                  mkdir -p release-packages
                  cp "$chrome" release-packages/
                  cp "$firefox" release-packages/

            - name: Upload extension packages
              uses: actions/upload-artifact@v4
              with:
                  name: browser-extension-packages
                  path: |
                      release-packages/*-chrome.zip
                      release-packages/*-firefox.zip
                  if-no-files-found: error
                  retention-days: 14

    # Tag-only: lint + sign the Firefox build with AMO (unlisted channel).
    # Isolated in its own job so a downstream R2 failure never forces a re-sign
    # (AMO rejects duplicate versions, which would wedge re-runs).
    sign:
        name: Sign Firefox build (AMO unlisted)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Build Chromium extension
              run: bun run zip

            - name: Build Firefox extension
              run: bun run zip:firefox

            - name: Prepare release packages
              run: |
                  version="$(node -p "require('./package.json').version")"
                  chrome=".output/belle-pku-${version}-chrome.zip"
                  firefox=".output/belle-pku-${version}-firefox.zip"
                  test -f "$chrome"
                  test -f "$firefox"
                  mkdir -p release-packages
                  cp "$chrome" release-packages/
                  cp "$firefox" release-packages/

            - name: Lint Firefox package
              run: bunx web-ext lint --source-dir .output/firefox-mv2 --self-hosted

            - name: Sign with AMO (unlisted)
              env:
                  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
                  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
              run: |
                  bunx web-ext sign \
                      --source-dir .output/firefox-mv2 \
                      --artifacts-dir release-packages \
                      --channel unlisted \
                      --api-key "$AMO_JWT_ISSUER" \
                      --api-secret "$AMO_JWT_SECRET"
                  # web-ext's output filename is not deterministic; rename for publishing.
                  version="$(node -p "require('./package.json').version")"
                  xpi="$(ls release-packages/*.xpi | head -n 1)"
                  test -f "$xpi"
                  mv "$xpi" "release-packages/belle-pku-${version}.xpi"
                  test -f "release-packages/belle-pku-${version}.xpi"

            - name: Upload signed packages
              uses: actions/upload-artifact@v4
              with:
                  name: signed-packages
                  path: |
                      release-packages/*-chrome.zip
                      release-packages/*-firefox.zip
                      release-packages/*.xpi
                  if-no-files-found: error
                  retention-days: 14

    # Tag-only: push the signed XPI + update manifest to R2. No AMO contact, so
    # `gh run rerun --failed` is always safe here.
    publish:
        name: Publish to R2 (XPI + updates.json)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        needs: sign
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Download signed packages
              uses: actions/download-artifact@v4
              with:
                  name: signed-packages
                  path: release-packages

            - name: Publish signed XPI and update manifest to R2
              env:
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
                  R2_BUCKET: ${{ secrets.R2_BUCKET }}
                  R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
              run: node scripts/publish-firefox-updates.mjs

    # Tag-only: attach the signed XPI + Chrome zip to the GitHub Release.
    release:
        name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        needs: [sign, publish]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download signed packages
              uses: actions/download-artifact@v4
              with:
                  name: signed-packages
                  path: release-packages

            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  shopt -s nullglob
                  chrome=(release-packages/*-chrome.zip)
                  xpi=(release-packages/*.xpi)
                  test "${#chrome[@]}" -eq 1
                  test "${#xpi[@]}" -eq 1
                  gh release create "$GITHUB_REF_NAME" \
                      --verify-tag \
                      --generate-notes \
                      "${chrome[0]}" \
                      "${xpi[0]}" \
                  || gh release upload "$GITHUB_REF_NAME" --clobber "${chrome[0]}" "${xpi[0]}"

name: Build and Release Extension

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ci:
        name: Build extensions
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Build Chromium extension
              run: bun run zip

            - name: Build Firefox extension
              run: bun run zip:firefox

            - name: Prepare release packages
              run: |
                  mkdir -p release-packages
                  cp .output/*-chrome.zip release-packages/
                  cp .output/*-firefox.zip release-packages/

            - name: Upload extension packages
              uses: actions/upload-artifact@v4
              with:
                  name: browser-extension-packages
                  path: release-packages/*.zip
                  if-no-files-found: error
                  retention-days: 14

    release:
        name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download extension packages
              uses: actions/download-artifact@v4
              with:
                  name: browser-extension-packages
                  path: release-packages

            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                      --verify-tag \
                      --generate-notes \
                      release-packages/*-chrome.zip \
                      release-packages/*-firefox.zip

name: Build and Release Extension

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ci:
        name: Build extensions
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Clean generated packages
              run: rm -rf .output release-packages

            - name: Typecheck
              run: bun run typecheck

            - name: Build Chromium extension
              run: bun run zip

            - name: Build Firefox extension
              run: bun run zip:firefox

            - name: Prepare release packages
              run: |
                  version="$(node -p "require('./package.json').version")"
                  chrome=".output/belle-pku-${version}-chrome.zip"
                  firefox=".output/belle-pku-${version}-firefox.zip"
                  test -f "$chrome"
                  test -f "$firefox"
                  mkdir -p release-packages
                  cp "$chrome" release-packages/
                  cp "$firefox" release-packages/

            # Tag-only: lint and sign the Firefox build with AMO (unlisted channel),
            # then publish the signed XPI + updates.json to R2 for auto-updates.
            - name: Lint Firefox package
              if: startsWith(github.ref, 'refs/tags/v')
              run: bunx web-ext lint --source-dir .output/firefox-mv2 --self-hosted

            - name: Sign Firefox extension with AMO (unlisted)
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
                  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
              run: |
                  bunx web-ext sign \
                      --source-dir .output/firefox-mv2 \
                      --artifacts-dir release-packages \
                      --channel unlisted \
                      --api-key "$AMO_JWT_ISSUER" \
                      --api-secret "$AMO_JWT_SECRET"
                  # web-ext writes release-packages/<name>-<version>.xpi (possibly signed
                  # with a randomized filename); rename deterministically for publishing.
                  version="$(node -p "require('./package.json').version")"
                  xpi="$(ls release-packages/*.xpi | head -n 1)"
                  test -f "$xpi"
                  mv "$xpi" "release-packages/belle-pku-${version}.xpi"
                  test -f "release-packages/belle-pku-${version}.xpi"

            - name: Publish signed XPI and update manifest to R2
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
                  R2_BUCKET: ${{ secrets.R2_BUCKET }}
                  # Optional overrides; defaults live in the script.
                  R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
              run: node scripts/publish-firefox-updates.mjs

            - name: Upload extension packages
              uses: actions/upload-artifact@v4
              with:
                  name: browser-extension-packages
                  path: |
                      release-packages/*-chrome.zip
                      release-packages/*-firefox.zip
                      release-packages/*.xpi
                  if-no-files-found: error
                  retention-days: 14

    release:
        name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download extension packages
              uses: actions/download-artifact@v4
              with:
                  name: browser-extension-packages
                  path: release-packages

            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  shopt -s nullglob
                  chrome=(release-packages/*-chrome.zip)
                  firefox_signed=(release-packages/*.xpi)
                  test "${#chrome[@]}" -eq 1
                  test "${#firefox_signed[@]}" -eq 1
                  gh release create "$GITHUB_REF_NAME" \
                      --verify-tag \
                      --generate-notes \
                      "${chrome[0]}" \
                      "${firefox_signed[0]}"
